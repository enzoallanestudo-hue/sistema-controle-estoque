<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Garoto do Frango</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="bootstrap-ajustes.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="tela-login">

    <section class="painel-marca">
      <img class="logo" src="imagens/logo.png" alt="Logo do Garoto do Frango">

      <div class="texto-marca">
        <h1>Sistema de Controle de Estoque</h1>
        <p>Mais organização e controle para o seu negócio.</p>
      </div>

      <p class="rodape-marca">Garoto do Frango</p>
    </section>

    
    <section class="painel-login">
      <form id="form-login" class="form-login" novalidate>

        <h2>Bem-vindo!</h2>
        <p class="instrucao">Faça login para acessar o sistema.</p>

       
        <div class="grupo-campo">
          <div class="campo">
            <svg class="icone" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <circle cx="12" cy="8" r="4"></circle>
              <path d="M4 21c0-4 4-6 8-6s8 2 8 6"></path>
            </svg>
            <label for="usuario" class="so-leitor-de-tela">Usuário</label>
            <input type="text" id="usuario" name="usuario" placeholder="Usuário" autocomplete="username">
          </div>
          <p class="mensagem-erro" id="erro-usuario"></p>
        </div>

        
        <div class="grupo-campo">
          <div class="campo">
            <svg class="icone" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <rect x="5" y="11" width="14" height="10" rx="2"></rect>
              <path d="M8 11V7a4 4 0 0 1 8 0v4"></path>
            </svg>
            <label for="senha" class="so-leitor-de-tela">Senha</label>
            <input type="password" id="senha" name="senha" placeholder="Senha" autocomplete="current-password">
            <button type="button" id="botao-senha" class="botao-olho" aria-label="Mostrar ou ocultar senha">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
          <p class="mensagem-erro" id="erro-senha"></p>
        </div>

    
        <button type="submit" class="btn btn-danger botao-entrar">Entrar</button>

        
        <p class="mensagem-sucesso" id="mensagem-sucesso"></p>

        

      </form>
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
