<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Produtos - Garoto do Frango</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="bootstrap-ajustes.css">
  <link rel="stylesheet" href="inicio.css">
  <link rel="stylesheet" href="produtos.css">
</head>
<body>

  <div class="layout">


    <aside class="menu-lateral">
      <img class="logo-menu" src="imagens/logo.png" alt="Logo do Garoto do Frango">

      <nav class="menu-links">
        <a href="inicio.html" class="link-menu">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M3 11l9-8 9 8"></path>
            <path d="M5 10v10h14V10"></path>
          </svg>
          Início
        </a>
        <a href="produtos.html" class="link-menu ativo">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M21 8l-9-5-9 5 9 5 9-5z"></path>
            <path d="M3 8v8l9 5 9-5V8"></path>
            <path d="M12 13v8"></path>
          </svg>
          Produtos
        </a>
        <a href="movimentacoes.html" class="link-menu">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M4 8h16"></path>
            <path d="M16 4l4 4-4 4"></path>
            <path d="M20 16H4"></path>
            <path d="M8 12l-4 4 4 4"></path>
          </svg>
          Movimentações
        </a>
      </nav>

      <a href="index.html" class="link-menu sair">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <path d="M16 17l5-5-5-5"></path>
          <path d="M21 12H9"></path>
        </svg>
        Sair
      </a>
    </aside>


    <main class="conteudo">

      <div class="topo-produtos">
        <div>
          <h1>Produtos</h1>
          <p class="subtitulo">Gerencie os itens do seu estoque</p>
        </div>
        <button type="button" class="btn btn-danger px-4 py-2 fw-semibold" id="botao-novo">+ Novo produto</button>
      </div>


      <div class="busca">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <circle cx="11" cy="11" r="7"></circle>
          <path d="M20 20l-4-4"></path>
        </svg>
        <input type="text" id="busca" placeholder="Pesquisar produto...">
      </div>


      <div class="bloco bloco-tabela">
        <table class="table table-hover align-middle mb-0 tabela tabela-produtos">
          <thead>
            <tr>
              <th>Produto</th>
              <th>Unidade</th>
              <th>Atual</th>
              <th>Mínimo</th>
              <th>Situação</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="tabela-produtos"></tbody>
        </table>
      </div>

    </main>
  </div>


  <div class="modal" id="modal">
      <form class="modal-caixa" id="form-produto" novalidate>
      <h2 id="modal-titulo">Novo produto</h2>

      <label for="campo-nome">Nome</label>
      <input type="text" class="form-control" id="campo-nome" placeholder="Ex.: Frango">

      <label for="campo-unidade">Unidade</label>
      <select class="form-select" id="campo-unidade">
        <option value="">Selecione...</option>
        <option value="Unidade">Unidade</option>
        <option value="Quilo">Quilo</option>
        <option value="Balde">Balde</option>
        <option value="Pacote">Pacote</option>
        <option value="Garrafa">Garrafa</option>
        <option value="Caixa">Caixa</option>
        <option value="Fargo">Caixa</option>
      </select>

      <div class="row g-3">
        <div class="col-6">
          <label for="campo-atual">Quantidade atual</label>
          <input type="number" class="form-control" id="campo-atual" min="0" step="any">
        </div>
        <div class="col-6">
          <label for="campo-minimo">Quantidade mínima</label>
          <input type="number" class="form-control" id="campo-minimo" min="0" step="any">
        </div>
      </div>

      <label for="campo-imagem">Foto (opcional)</label>
      <input type="text" class="form-control" id="campo-imagem" placeholder="Ex.: imagens/produtos/frango.png">

      <p class="erro-form" id="erro-form"></p>

      <div class="modal-botoes">
        <button type="button" class="btn btn-light border px-4 py-2" id="botao-cancelar">Cancelar</button>
        <button type="submit" class="btn btn-danger px-4 py-2 fw-semibold">Salvar</button>
      </div>
    </form>
  </div>

  <script src="dados.js"></script>
  <script src="produtos.js"></script>
</body>
</html>
