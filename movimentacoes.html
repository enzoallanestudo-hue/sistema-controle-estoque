<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="bootstrap-ajustes.css">
  <link rel="stylesheet" href="inicio.css">
  <link rel="stylesheet" href="produtos.css">
  <link rel="stylesheet" href="movimentacoes.css">
</head>
<body>

  <div class="layout">


    <aside class="menu-lateral">
      <img class="logo-menu" src="imagens/logo.png" alt="Logo do Garoto do Frango">

      <nav class="menu-links">
        <a href="inicio.html" class="link-menu">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M3 11l9-8 9 8"></path>
            <path d="M5 10v10h14V10"></path>
          </svg>
          Início
        </a>
        <a href="produtos.html" class="link-menu">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M21 8l-9-5-9 5 9 5 9-5z"></path>
            <path d="M3 8v8l9 5 9-5V8"></path>
            <path d="M12 13v8"></path>
          </svg>
          Produtos
        </a>
        <a href="movimentacoes.html" class="link-menu ativo">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M4 8h16"></path>
            <path d="M16 4l4 4-4 4"></path>
            <path d="M20 16H4"></path>
            <path d="M8 12l-4 4 4 4"></path>
          </svg>
          Movimentações
        </a>
      </nav>

      <a href="index.html" class="link-menu sair">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <path d="M16 17l5-5-5-5"></path>
          <path d="M21 12H9"></path>
        </svg>
        Sair
      </a>
    </aside>


    <main class="conteudo">

      <a href="inicio.html" class="voltar">&lsaquo; Voltar</a>

      <h1>Movimentações de Estoque</h1>
      <p class="subtitulo">Registre entradas e saídas de produtos do estoque.</p>


       <form class="bloco formulario" id="form-mov" novalidate>

        <div class="row g-4 mb-3">
          <div class="col-md-6">
            <label class="rotulo" for="campo-produto">Produto</label>
            <select class="form-select" id="campo-produto"></select>
            <p class="dica" id="dica-estoque"></p>
          </div>

          <div class="col-md-6">
            <span class="rotulo">Tipo de movimentação</span>
            <div class="opcoes-tipo">
              <label class="opcao-tipo">
                <input type="radio" name="tipo" value="entrada"> Entrada
              </label>
              <label class="opcao-tipo">
                <input type="radio" name="tipo" value="saida"> Saída
              </label>
            </div>
          </div>
        </div>

        <div class="row g-4 mb-3">
          <div class="col-md-4">
            <label class="rotulo" for="campo-quantidade">Quantidade</label>
            <input type="number" class="form-control" id="campo-quantidade" min="0" step="any" placeholder="Digite a quantidade">
          </div>

          <div class="col-md-8">
            <label class="rotulo" for="campo-observacao">Observação (opcional)</label>
            <input type="text" class="form-control" id="campo-observacao" placeholder="Ex.: reposição de estoque">
          </div>
        </div>

        <p class="erro-form" id="erro-form"></p>
        <p class="sucesso-form" id="sucesso-form"></p>

        <div class="botoes-form">
          <button type="button" class="btn btn-light border px-4 py-2" id="botao-cancelar">Cancelar</button>
          <button type="submit" class="btn btn-danger px-4 py-2 fw-semibold">Registrar movimentação</button>
        </div>
      </form>


      <h2 class="titulo-secao">Últimas movimentações</h2>
      <div class="bloco bloco-tabela">
        <table class="table table-hover align-middle mb-0 tabela tabela-mov">
          <thead>
            <tr>
              <th>Data</th>
              <th>Produto</th>
              <th>Tipo</th>
              <th>Quantidade</th>
              <th>Observação</th>
            </tr>
          </thead>
          <tbody id="tabela-movimentacoes"></tbody>
        </table>
      </div>

    </main>
  </div>

  <script src="dados.js"></script>
  <script src="movimentacoes.js"></script>
</body>
</html>
